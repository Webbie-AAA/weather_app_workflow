
name: Weather Pipeline CI/CD (JS)

on:
  push:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_and_fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest weather
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          CITY: ${{ secrets.CITY }}
        run: node fetchWeather.js

      - name: Run tests
        run: npm test

      - name: Commit weather data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/weather.json data/weather_log.csv

          if ! git diff --cached --quiet; then
            git commit -m "ci: update weather data"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            -X POST "$RENDER_DEPLOY_HOOK"
